name: Ruff Linter

on:
  push:
    branches: [ main, develop, feature/pipelines]
  pull_request:
    branches: [ main, develop, feature/pipelines]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies (only dev)
        run: uv sync --group dev

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff diff check
        run: uv run ruff check . --diff