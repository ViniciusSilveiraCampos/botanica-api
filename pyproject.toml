[project]
name = "fast-zero"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "ViniciusSilveiraCampos", email = "108243297+ViniciusSilveiraCampos@users.noreply.github.com" }
]

requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.112.0",
    "fastapi>=0.112.0",
    "sqlalchemy>=2.0.32",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.2",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "mysqlclient>=2.2.4",
    "psycopg2-binary>=2.9.9",
    "mkdocs-material>=9.6.10",
    "pymdown-extensions>=10.14.3",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs>=1.6.1"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.6",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "taskipy>=1.13.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "freezegun>=1.5.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = [
    "E",   
    "W",  
    "I", 
    "RUF100",
    "PLR0913",
    "PLR0917"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check . && ruff check . --diff"
format = "black ."
run = "fastapi dev fast_zero/app.py"
pre_test = "task lint"
test = "pytest -s -x --cov=fast_zero -vv"
post_test = "coverage html"

[tool.hatch.build]
exclude = [
  "docs",
  "migrations",
  "tests",
  "*.db",
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.ico",
  "*.map",
  "*.gz",
  "*.svg",
  "*.txt",
  ".coverage",
  "*.html",
]
