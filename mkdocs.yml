site_name: Botanica API

theme:
  name: 'material'
  favicon: assets/images/emoji.png
  logo: assets/images/emoji.png
  palette: 
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - Accounts: accounts.md
  - Plants and Flowers: plants_and_flowers.md
  - The database (ORM): database.md

